<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>宛先ドメインの確認</title>
    <link rel="stylesheet" href="./dialog.css" />
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
  </head>
  <body>
    <main class="card" role="alertdialog" aria-labelledby="title" aria-describedby="lead">
      <header class="head">
        <span class="warn" aria-hidden="true">!</span>
        <h1 id="title">許可リストにないドメインが含まれています</h1>
      </header>

      <p id="lead" class="lead">
        次の宛先は社外送信の許可リストに登録されていません。内容を確認してください。
      </p>

      <section class="list-wrap">
        <ul id="list" class="list"></ul>
        <p id="more" class="more" hidden></p>
      </section>

      <footer class="actions">
        <button id="cancel" type="button" class="btn btn-primary">送信しない</button>
        <button id="send" type="button" class="btn">このまま送信する</button>
      </footer>
    </main>
    <script src="./dialog.js" type="text/javascript"></script>
  </body>
</html>
